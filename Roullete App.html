<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Cinematic Roulette Engine</title>
    <style>
        :root {
            --bg-dark: #07090e;
            --bg-light: #f8fafc;
            --panel-dark: rgba(13, 17, 28, 0.95);
            --panel-light: rgba(255, 255, 255, 0.95);
            
            --bg: var(--bg-dark);
            --panel-bg: var(--panel-dark);
            --text: #ffffff;
            --text-muted: #64748b;
            --accent: #00f2fe;
            --border: rgba(255, 255, 255, 0.08);
            --wheel-ring: #1e293b;
            
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--font-sans);
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        #bg-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.6;
        }

        #top-bar {
            position: absolute;
            top: 0; left: 0; width: 100%;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        #activity-title {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: auto;
            background: linear-gradient(90deg, #ffffff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-controls {
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .btn-action:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        #main-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
            padding: 20px;
            margin-top: 60px;
        }

        #live-ticker {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 40px;
            height: 60px;
            line-height: 60px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            color: var(--text);
            max-width: 90vw;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        #wheel-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        #wheel-wrapper {
            position: relative;
            width: 78vmin;
            height: 78vmin;
            max-width: 520px;
            max-height: 520px;
            border-radius: 50%;
            transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1);
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        #ticker-pin {
            position: absolute;
            top: -18px;
            left: calc(50% - 16px);
            width: 32px;
            height: 40px;
            background: #ffffff;
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 15;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transform-origin: 50% 0%;
            transition: transform 0.05s linear;
        }

        #start-button {
            background: var(--text);
            color: var(--bg);
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 4px;
            padding: 18px 70px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #start-button:hover {
            background: var(--accent);
            color: #000000;
            transform: scale(1.04);
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.4);
        }
        #start-button:disabled {
            background: #222 !important;
            color: #555 !important;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Sliding Panel Mechanics */
        .sliding-sheet {
            position: fixed;
            top: 0; right: 0;
            width: 420px; max-width: 100vw; height: 100vh;
            background: var(--panel-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-left: 1px solid var(--border);
            z-index: 100;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            flex-direction: column;
        }
        .sliding-sheet.open { transform: translateX(0); }

        .sheet-header {
            padding: 30px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sheet-header h2 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; }
        
        .sheet-body {
            padding: 30px;
            overflow-y: auto;
            flex: 1;
        }

        h3 { margin: 25px 0 12px 0; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); }
        label { display: block; font-size: 0.8rem; margin-bottom: 8px; color: var(--text-muted); }
        
        textarea, input, select {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: rgba(0,0,0,0.2);
            color: var(--text);
            font-family: inherit;
            font-size: 0.9rem;
        }
        textarea { height: 140px; resize: none; }
        textarea:focus, input:focus, select:focus { border-color: var(--accent); outline: none; }
        
        .panel-row { display: flex; gap: 10px; margin-bottom: 20px; }
        .panel-row button { flex: 1; padding: 12px; border-radius: 6px; background: transparent; border: 1px solid var(--border); color: var(--text); font-weight: 600; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; }
        .panel-row button:hover { border-color: var(--accent); }

        #history-box, #pool-box {
            background: rgba(0,0,0,0.1);
            border: 1px solid var(--border);
            border-radius: 6px;
            height: 150px;
            overflow-y: auto;
            padding: 10px;
        }
        .item-log { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.02); font-size: 0.85rem; }

        /* Fullscreen Overlay Result Stage */
        #reveal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000000;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #reveal-overlay.active { opacity: 1; pointer-events: auto; }

        #reveal-word {
            font-size: 7vw;
            font-weight: 900;
            text-align: center;
            padding: 20px;
            text-transform: uppercase;
            letter-spacing: -1px;
            transform: scale(0.7);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #reveal-overlay.active #reveal-word { transform: scale(1); }

        .anim-exciting { animation: glowPulse 2s infinite ease-in-out; }
        .anim-threatening { color: #ff0055 !important; animation: glitchShake 0.1s infinite alternate; }

        @keyframes glowPulse {
            0%, 100% { text-shadow: 0 0 40px var(--accent); transform: scale(1); }
            50% { text-shadow: 0 0 80px #ff007f, 0 0 120px #ff007f; transform: scale(1.05); }
        }
        @keyframes glitchShake {
            0% { transform: translate(2px, 2px); text-shadow: 3px 0 #00f2fe; }
            100% { transform: translate(-2px, -2px); text-shadow: -3px 0 #ff0055; }
        }

        .checkbox-label { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; font-size: 0.85rem; cursor: pointer; }
        .checkbox-label input { width: auto; margin: 0; }

        @media (max-width: 768px) {
            #reveal-word { font-size: 15vw; }
            #live-ticker { font-size: 2rem; }
            .sliding-sheet { width: 100%; }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div id="top-bar">
        <div id="activity-title">Roulette Engine</div>
        <div class="header-controls">
            <button class="btn-action" onclick="openPanel('sheet-history')">Log</button>
            <button class="btn-action" onclick="openPanel('sheet-settings')">Config</button>
        </div>
    </div>

    <div id="main-stage">
        <div id="live-ticker">Ready to Spin</div>
        <div id="wheel-container">
            <div id="ticker-pin"></div>
            <div id="wheel-wrapper">
                <canvas id="wheelCanvas" width="1200" height="1200"></canvas>
            </div>
            <button id="start-button" onclick="executeStartAction()">Start</button>
        </div>
    </div>

    <div id="sheet-history" class="sliding-sheet">
        <div class="sheet-header">
            <h2>Session Logs</h2>
            <button class="btn-action" onclick="closePanels()">Close</button>
        </div>
        <div class="sheet-body">
            <h3>Selected Winners</h3>
            <div id="history-box"></div>
            <h3>Remaining Pool</h3>
            <div id="pool-box"></div>
        </div>
    </div>

    <div id="sheet-settings" class="sliding-sheet">
        <div class="sheet-header">
            <h2>Parameters</h2>
            <button class="btn-action" onclick="closePanels()">Close</button>
        </div>
        <div class="sheet-body">
            <label>Roster Entries (Line separated)</label>
            <textarea id="participants-input" oninput="loadFromInput()">Neon Pink&#10;Cyber Cyan&#10;Electric Violet&#10;Acid Lime&#10;Sunset Tangerine&#10;Quantum White&#10;Deep Matrix&#10;Solar Flare</textarea>
            
            <label>Theme Architecture</label>
            <select id="cfg-theme" onchange="renderWheel()">
                <option value="carnival" selected>Carnival (Neon Punch Darkspectrum)</option>
                <option value="candy">Candy (Vibrant Pastel Contrast Array)</option>
                <option value="mono">Mono (Procedural Accent Array)</option>
            </select>

            <label>Lighting Interface Style</label>
            <select id="cfg-lighting" onchange="updateLightingMode(this.value)">
                <option value="dark" selected>Midnight Obsidian</option>
                <option value="light">Studio Minimalist Light</option>
            </select>

            <label>Accent Dynamic Signature Node</label>
            <input type="color" id="cfg-accent" value="#00f2fe" onchange="updateAccentColor(this.value)">

            <label>Spin Duration Metrics (Seconds)</label>
            <input type="number" id="cfg-duration" value="5" min="2" max="15">

            <label>Climax Showcase Modality</label>
            <select id="cfg-reveal">
                <option value="exciting" selected>Exciting Pop (Chromatophores)</option>
                <option value="threatening">Threatening Glitch (Voltage Drop)</option>
            </select>

            <label class="checkbox-label">
                <input type="checkbox" id="chk-remove-selected" checked> Auto-drop winner from operational pool
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="chk-avoid-repeats" checked> Prevent sequential duplicate wins
            </label>
        </div>
    </div>

    <div id="reveal-overlay" onclick="closeReveal()">
        <div id="reveal-word">WINNER</div>
        <p style="opacity:0.4; font-size:0.75rem; margin-top:40px; letter-spacing:3px; text-transform:uppercase; color:#fff;">Click Screen to Dismiss</p>
    </div>

    <script>
        let participants = [];
        let historyLog = [];
        let lastWinner = null;
        let currentRotation = 0;
        let isSpinning = false;
        
        // Physics and Angle Tracking
        let isDragging = false;
        let startAngle = 0;
        let currentDragAngle = 0;
        let rotationVelocity = 0;
        let lastTargetAngle = 0;
        let frameRotationDelta = 0;

        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let lastTickSegment = 0;

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const wheelWrapper = document.getElementById('wheel-wrapper');
        const pinEl = document.getElementById('ticker-pin');
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');

        // Professional High-Fidelity Deep Color Palettes
        const palettes = {
            carnival: ['#ff0055', '#00f2fe', '#7000ff', '#ffb800', '#00ff66', '#ff00aa', '#0055ff', '#a1ff00'],
            candy: ['#ff758c', '#ffffff', '#ff7eb3', '#ffffff', '#8ec5fc', '#ffffff', '#e0c3fc', '#ffffff'],
            mono: []
        };

        let particlesArray = [];

        window.onload = () => {
            configureCanvasViewports();
            window.addEventListener('resize', configureCanvasViewports);
            setupInteractivePhysics();
            updateLightingMode("dark");
            updateAccentColor("#00f2fe");
            loadFromInput();
            initAmbientParticles();
            runParticleEngine();
        };

        function configureCanvasViewports() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
            renderWheel();
        }

        function updateAccentColor(color) {
            document.documentElement.style.setProperty('--accent', color);
            const startBtn = document.getElementById('start-button');
            if (!isSpinning) startBtn.style.borderColor = color;
            renderWheel();
        }

        function updateLightingMode(mode) {
            if(mode === 'light') {
                document.documentElement.style.setProperty('--bg', 'var(--bg-light)');
                document.documentElement.style.setProperty('--panel-bg', 'var(--panel-light)');
                document.documentElement.style.setProperty('--text', '#0f172a');
                document.documentElement.style.setProperty('--text-muted', '#64748b');
                document.documentElement.style.setProperty('--border', 'rgba(0,0,0,0.06)');
                document.documentElement.style.setProperty('--wheel-ring', '#e2e8f0');
                pinEl.style.background = '#0f172a';
            } else {
                document.documentElement.style.setProperty('--bg', 'var(--bg-dark)');
                document.documentElement.style.setProperty('--panel-bg', 'var(--panel-dark)');
                document.documentElement.style.setProperty('--text', '#ffffff');
                document.documentElement.style.setProperty('--text-muted', '#64748b');
                document.documentElement.style.setProperty('--border', 'rgba(255,255,255,0.08)');
                document.documentElement.style.setProperty('--wheel-ring', '#1e293b');
                pinEl.style.background = '#ffffff';
            }
            renderWheel();
        }

        function loadFromInput() {
            const data = document.getElementById('participants-input').value;
            participants = data.split(/[\n,]+/).map(item => item.trim()).filter(item => item.length > 0);
            renderWheel();
            refreshPanelBoxes();
        }

        function openPanel(id) {
            closePanels();
            document.getElementById(id).classList.add('open');
        }
        function closePanels() {
            document.querySelectorAll('.sliding-sheet').forEach(p => p.classList.remove('open'));
        }

        function playTickAudio() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gainNode = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.02);
            gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.02);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.02);
        }

        function getCalculatedColors() {
            const selected = document.getElementById('cfg-theme').value;
            const primaryAccent = document.getElementById('cfg-accent').value;
            if (selected === 'mono') {
                return [
                    primaryAccent, 
                    shiftColorBrightness(primaryAccent, -15), 
                    shiftColorBrightness(primaryAccent, -30), 
                    shiftColorBrightness(primaryAccent, 15)
                ];
            }
            return palettes[selected];
        }

        function shiftColorBrightness(hex, percent) {
            let R = parseInt(hex.substring(1,3),16), G = parseInt(hex.substring(3,5),16), B = parseInt(hex.substring(5,7),16);
            R = Math.min(255, Math.max(0, parseInt(R * (100 + percent) / 100)));
            G = Math.min(255, Math.max(0, parseInt(G * (100 + percent) / 100)));
            B = Math.min(255, Math.max(0, parseInt(B * (100 + percent) / 100)));
            return `#${((1 << 24) + (R << 16) + (G << 8) + B).toString(16).slice(1)}`;
        }

        /* Highly Advanced Mathematical Canvas Matrix Engine
           Fits and curves font boundaries accurately to sector sizes 
        */
        function renderWheel() {
            const count = participants.length;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (count === 0) {
                ctx.fillStyle = '#64748b';
                ctx.textAlign = 'center';
                ctx.font = '700 24px var(--font-sans)';
                ctx.fillText('NO PARTICIPANTS LOADED', canvas.width/2, canvas.height/2);
                return;
            }

            const arcStep = (2 * Math.PI) / count;
            const themeColors = getCalculatedColors();
            const activeTheme = document.getElementById('cfg-theme').value;
            const lightingMode = document.getElementById('cfg-lighting').value;
            const accent = document.getElementById('cfg-accent').value;

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const radius = canvas.width / 2 - 40;

            // Base Outer Core Enclosure Ring Rim Shadow
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, radius + 20, 0, 2 * Math.PI);
            ctx.fillStyle = lightingMode === 'light' ? 'rgba(0,0,0,0.06)' : 'rgba(0,0,0,0.6)';
            ctx.fill();
            ctx.restore();

            // Core Housing Perimeter Boundary Ring
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, radius + 10, 0, 2 * Math.PI);
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--wheel-ring').trim();
            ctx.fill();
            ctx.restore();

            // Transform Core Vectors for Rotation Physics
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(currentRotation);

            for (let i = 0; i < count; i++) {
                const currentSectorAngle = i * arcStep;
                
                // Color Assignation Architectures
                if (activeTheme === 'candy' && themeColors[i % themeColors.length] === '#ffffff') {
                    ctx.fillStyle = lightingMode === 'light' ? '#f1f5f9' : '#1e293b';
                } else {
                    ctx.fillStyle = themeColors[i % themeColors.length];
                }

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, currentSectorAngle, currentSectorAngle + arcStep);
                ctx.lineTo(0, 0);
                ctx.fill();

                // Advanced Clean Outlines Separation Metrics
                if(activeTheme === 'candy') {
                    ctx.strokeStyle = lightingMode === 'light' ? '#0f172a' : '#ffffff';
                    ctx.lineWidth = 4;
                    ctx.stroke();
                } else {
                    ctx.strokeStyle = 'rgba(7, 9, 14, 0.15)';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }

                // 3D Lighting and Shadow Layer
                ctx.save();
                ctx.rotate(currentSectorAngle);
                let sectorShadowGrad = ctx.createLinearGradient(0, 0, radius, 0);
                sectorShadowGrad.addColorStop(0, 'rgba(0,0,0,0.28)');
                sectorShadowGrad.addColorStop(0.4, 'rgba(0,0,0,0.0)');
                sectorShadowGrad.addColorStop(1, 'rgba(255,255,255,0.06)');
                ctx.fillStyle = sectorShadowGrad;
                ctx.beginPath();
                ctx.moveTo(0,0);
                ctx.arc(0, 0, radius, 0, arcStep);
                ctx.lineTo(0,0);
                ctx.fill();
                ctx.restore();

                // Dynamic Geometric Text Fit Calculation Engineering
                ctx.save();
                ctx.rotate(currentSectorAngle + arcStep / 2);
                
                // Calculate actual geometric boundary safe zones inside the sector arc slice
                const radialZoneMin = radius * 0.25;
                const radialZoneMax = radius * 0.88;
                const availableRadialLength = radialZoneMax - radialZoneMin;
                
                // Compute width at 65% out to optimize font size
                const geometricWidthToken = (radius * 0.6) * arcStep;
                
                // Dynamic font scaling formula
                let fontSize = Math.min(availableRadialLength * 0.15, geometricWidthToken * 0.55);
                if (fontSize < 14) fontSize = 14;
                if (fontSize > 50) fontSize = 50;

                ctx.font = `800 ${fontSize}px var(--font-sans)`;
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                
                let stringVal = participants[i];
                
                // Realtime character truncation based on available space
                let textMeasurement = ctx.measureText(stringVal).width;
                if (textMeasurement > (radius * 0.58)) {
                    while (textMeasurement > (radius * 0.52) && stringVal.length > 0) {
                        stringVal = stringVal.slice(0, -1);
                        textMeasurement = ctx.measureText(stringVal + '...').width;
                    }
                    stringVal += '...';
                }

                // Dynamic Color High Contrast Adaptations
                if (activeTheme === 'candy') {
                    ctx.fillStyle = (themeColors[i % themeColors.length] === '#ffffff') ? '#ff0055' : '#ffffff';
                } else {
                    ctx.fillStyle = lightingMode === 'light' ? '#0f172a' : '#ffffff';
                }

                // Text Shadow Pass
                ctx.save();
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 6;
                ctx.fillText(stringVal, radius - 35, 0);
                ctx.restore();
                
                ctx.restore();
            }
            ctx.restore();

            // Center Dynamic Decorative Metal Hub Element
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 0.08, 0, 2 * Math.PI);
            let hubColorGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 0.08);
            hubColorGrad.addColorStop(0, '#ffffff');
            if (lightingMode === 'light') {
                hubColorGrad.addColorStop(1, '#cbd5e1');
            } else {
                hubColorGrad.addColorStop(1, '#0f172a');
            }
            ctx.fillStyle = hubColorGrad;
            ctx.fill();
        }

        /* Mouse/Touch Responsive Gestural Momentum Integration
           Tracks true physical coordinates and directly offsets the pin 
        */
        function setupInteractivePhysics() {
            wheelWrapper.addEventListener('mousedown', initiateDragSequence);
            window.addEventListener('mousemove', processDragSequence);
            window.addEventListener('mouseup', terminateDragSequence);

            wheelWrapper.addEventListener('touchstart', (e) => initiateDragSequence(e.touches[0]), {passive: true});
            window.addEventListener('touchmove', (e) => {
                processDragSequence(e.touches[0]);
                e.preventDefault();
            }, {passive: false});
            window.addEventListener('touchend', terminateDragSequence);
        }

        function parseCenterAngle(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - (rect.left + rect.width / 2);
            const y = e.clientY - (rect.top + rect.height / 2);
            return Math.atan2(y, x);
        }

        function initiateDragSequence(e) {
            if (isSpinning) return;
            isDragging = true;
            startAngle = parseCenterAngle(e) - currentRotation;
            rotationVelocity = 0;
            frameRotationDelta = currentRotation;
        }

        function processDragSequence(e) {
            if (!isDragging) return;
            
            const calculatedAngle = parseCenterAngle(e);
            currentRotation = calculatedAngle - startAngle;
            
            // Dynamic mouse distortion animation tilt response
            let tiltForceX = (e.clientX - (window.innerWidth / 2)) * 0.015;
            let tiltForceY = (e.clientY - (window.innerHeight / 2)) * 0.015;
            wheelWrapper.style.transform = `perspective(1000px) rotateX(${-tiltForceY}deg) rotateY(${tiltForceX}deg) scale(1.02)`;

            velocityEvaluationTrack();
            synchronizePinSelection();
            renderWheel();
        }

        function velocityEvaluationTrack() {
            rotationVelocity = currentRotation - frameRotationDelta;
            frameRotationDelta = currentRotation;
        }

        function terminateDragSequence() {
            if (!isDragging) return;
            isDragging = false;
            wheelWrapper.style.transform = "none";
            
            if (Math.abs(rotationVelocity) > 0.02) {
                executeMomentumSpin(rotationVelocity * 35);
            }
        }

        function executeStartAction() {
            if (isSpinning || participants.length === 0) return;
            const pushVector = (Math.random() * 20 + 25);
            executeMomentumSpin(pushVector);
        }

        /* High Precision Physical Pin Synchronization Layer
           Maps index arrays exactly to the top position (-90 degrees / -PI/2) 
        */
        function synchronizePinSelection() {
            if(participants.length === 0) return;
            const count = participants.length;
            const arcStep = (2 * Math.PI) / count;
            
            // Normalize current rotation range bounded mathematically within [0, 2*PI]
            let normalizedRotation = (-currentRotation - Math.PI/2) % (2 * Math.PI);
            if (normalizedRotation < 0) normalizedRotation += (2 * Math.PI);
            
            let targetSegmentIndex = Math.floor(normalizedRotation / arcStep) % count;
            if (targetSegmentIndex < 0) targetSegmentIndex += count;
            
            document.getElementById('live-ticker').innerText = participants[targetSegmentIndex];

            if (targetSegmentIndex !== lastTickSegment) {
                playTickAudio();
                
                // Physio-mimetic deflection oscillation math
                pinEl.style.transform = `rotate(18deg)`;
                setTimeout(() => pinEl.style.transform = `rotate(0deg)`, 40);
                
                lastTickSegment = targetSegmentIndex;
            }
        }

        /* Quintic Deceleration Core Physics Run Loop */
        function executeMomentumSpin(forceVector) {
            if (isSpinning || participants.length === 0) return;
            isSpinning = true;
            
            document.getElementById('start-button').disabled = true;
            const maxDuration = parseFloat(document.getElementById('cfg-duration').value) * 1000;
            let timestampStart = null;
            const initialAngle = currentRotation;

            function runDecelerationFrame(timestamp) {
                if (!timestampStart) timestampStart = timestamp;
                const progressTime = (timestamp - timestampStart) / maxDuration;

                const quinticEaseOut = 1 - Math.pow(1 - progressTime, 5);
                currentRotation = initialAngle + (quinticEaseOut * forceVector);
                
                synchronizePinSelection();
                renderWheel();

                if (progressTime < 1) {
                    requestAnimationFrame(runDecelerationFrame);
                } else {
                    finalizeSelectionCalculation();
                }
            }
            requestAnimationFrame(runDecelerationFrame);
        }

        function finalizeSelectionCalculation() {
            isSpinning = false;
            document.getElementById('start-button').disabled = false;
            
            const count = participants.length;
            const arcStep = (2 * Math.PI) / count;
            
            let normalizedRotation = (-currentRotation - Math.PI/2) % (2 * Math.PI);
            if (normalizedRotation < 0) normalizedRotation += (2 * Math.PI);
            
            let selectedIndex = Math.floor(normalizedRotation / arcStep) % count;
            if (selectedIndex < 0) selectedIndex += count;
            
            let roundWinner = participants[selectedIndex];

            if(document.getElementById('chk-avoid-repeats').checked && roundWinner === lastWinner && count > 1) {
                selectedIndex = (selectedIndex + 1) % count;
                roundWinner = participants[selectedIndex];
            }

            lastWinner = roundWinner;
            launchCinematicFullscreen(roundWinner, selectedIndex);
        }

        function launchCinematicFullscreen(winner, index) {
            const mode = document.getElementById('cfg-reveal').value;
            const overlay = document.getElementById('reveal-overlay');
            const targetWord = document.getElementById('reveal-word');
            
            targetWord.className = ""; 
            targetWord.innerText = winner;
            
            if (mode === 'exciting') {
                targetWord.classList.add('anim-exciting');
                triggerBurstExplosion();
            } else {
                targetWord.classList.add('anim-threatening');
            }

            overlay.classList.add('active');

            const sessionTime = new Date().toLocaleTimeString();
            historyLog.push({ name: winner, time: sessionTime });
            
            if (document.getElementById('chk-remove-selected').checked) {
                participants.splice(index, 1);
                document.getElementById('participants-input').value = participants.join('\n');
            }
            
            refreshPanelBoxes();
        }

        function closeReveal() {
            document.getElementById('reveal-overlay').classList.remove('active');
            document.getElementById('live-ticker').innerText = "Ready to Spin";
            renderWheel();
        }

        function refreshPanelBoxes() {
            document.getElementById('history-box').innerHTML = historyLog.map(item => `
                <div class="item-log"><strong>[${item.time}]</strong> ${item.name}</div>
            `).join('');
            
            document.getElementById('pool-box').innerHTML = participants.map(item => `
                <div class="item-log" style="color:var(--accent);">• ${item}</div>
            `).join('');
        }

        /* Ambient Dynamic Background Particles Layer */
        class DesignParticle {
            constructor(x, y, isBurst = false) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 2 + (isBurst ? 5 : 1);
                this.speedX = isBurst ? (Math.random() - 0.5) * 16 : (Math.random() - 0.5) * 1;
                this.speedY = isBurst ? (Math.random() - 0.5) * 16 : (Math.random() - 0.5) * 1;
                this.color = document.getElementById('cfg-accent').value;
                this.alpha = 1;
                this.decay = isBurst ? 0.015 : 0.006;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha -= this.decay;
            }
            draw() {
                bgCtx.save();
                bgCtx.globalAlpha = this.alpha;
                bgCtx.fillStyle = this.color;
                bgCtx.beginPath();
                bgCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                bgCtx.fill();
                bgCtx.restore();
            }
        }

        function initAmbientParticles() {
            particlesArray = [];
            const activePoolCount = window.innerWidth < 768 ? 20 : 50;
            for(let i=0; i<activePoolCount; i++) {
                particlesArray.push(new DesignParticle(Math.random()*window.innerWidth, Math.random()*window.innerHeight));
            }
        }

        function triggerBurstExplosion() {
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            for(let i=0; i<120; i++) {
                particlesArray.push(new DesignParticle(cx, cy, true));
            }
        }

        function runParticleEngine() {
            const lightingMode = document.getElementById('cfg-lighting').value;
            bgCtx.fillStyle = lightingMode === 'light' ? 'rgba(248,250,252,0.2)' : 'rgba(7,9,14,0.2)';
            bgCtx.fillRect(0,0,bgCanvas.width,bgCanvas.height);

            for(let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
                if(particlesArray[i].alpha <= 0) {
                    particlesArray.splice(i, 1);
                    i--;
                }
            }
            
            const limits = window.innerWidth < 768 ? 15 : 45;
            if(particlesArray.length < limits) {
                particlesArray.push(new DesignParticle(Math.random()*window.innerWidth, Math.random()*window.innerHeight));
            }

            requestAnimationFrame(runParticleEngine);
        }
    </script>
</body>
