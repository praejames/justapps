<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cap or Trap - Interactive Reviewer</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Space+Grotesk:wght@500;700&family=Bungee&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/input/confetti.browser.min.js"></script>

    <style>
        :root {
            --blur-amount: 12px;
            --accent-color: #3b82f6;
            --font-family: 'Space Grotesk', sans-serif;
        }
        body {
            font-family: var(--font-family);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background 0.5s ease;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .dark-glass {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f8fafc;
        }
        .light-glass {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
            border: 1px solid rgba(0, 0, 0, 0.08);
            color: #0f172a;
        }
        .card-container {
            position: relative;
            height: 380px;
            perspective: 1000px;
        }
        .swipe-card {
            position: absolute;
            width: 100%;
            height: 100%;
            cursor: grab;
            transform-origin: 50% 99%;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .swipe-card:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="w-screen h-screen overflow-x-hidden flex items-center justify-center p-4 bg-slate-900 text-white">

    <audio id="bg-music" loop></audio>

    <div id="app-shell" class="w-full max-w-md h-[90vh] flex flex-col justify-between rounded-3xl p-6 shadow-2xl relative overflow-y-auto dark-glass">
        
        <div id="screen-login" class="flex-1 flex flex-col justify-center space-y-6">
            <div class="text-center">
                <h1 id="app-title-display" class="text-4xl font-extrabold tracking-wider uppercase text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 mb-2" style="font-family: 'Bungee', cursive;">CAP OR TRAP</h1>
                <p class="text-xs opacity-60">The Ultimate Swipe Review System</p>
            </div>

            <div class="space-y-4">
                <div class="flex rounded-xl bg-black/20 p-1">
                    <button onclick="switchRole('participant')" id="tab-part" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-blue-500 text-white transition-all">Participant</button>
                    <button onclick="switchRole('facilitator')" id="tab-faci" class="flex-1 py-2 text-sm font-semibold rounded-lg opacity-60 transition-all">Facilitator</button>
                </div>

                <div id="form-participant" class="space-y-3">
                    <input type="text" id="part-name" placeholder="Enter Your Nickname" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:outline-none focus:border-blue-400 text-sm">
                    <input type="text" id="part-code" maxlength="4" placeholder="4-Char Access Code" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:outline-none focus:border-blue-400 uppercase tracking-widest text-center text-sm">
                    <button onclick="loginParticipant()" class="w-full py-3 bg-blue-500 hover:bg-blue-600 rounded-xl font-bold transition-all text-sm shadow-lg shadow-blue-500/20">ENTER SESSION</button>
                </div>

                <div id="form-facilitator" class="space-y-3 hidden">
                    <input type="text" id="faci-code" maxlength="4" placeholder="Create 4-Char Lock Code" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:outline-none focus:border-emerald-400 uppercase tracking-widest text-center text-sm">
                    <button onclick="loginFacilitator()" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 rounded-xl font-bold transition-all text-sm shadow-lg shadow-emerald-500/20">MANAGE / CREATE</button>
                </div>
            </div>
        </div>

        <div id="screen-faci-dash" class="flex-1 flex flex-col space-y-4 hidden">
            <div class="flex justify-between items-center border-b border-white/10 pb-2">
                <h2 class="font-bold text-lg text-emerald-400"><i class="fa-solid fa-chalkboard-user mr-2"></i>Control Deck</h2>
                <button onclick="logout()" class="text-xs bg-white/10 px-2 py-1 rounded hover:bg-red-500/20">Exit</button>
            </div>

            <div class="space-y-3 flex-1 overflow-y-auto pr-1 text-xs">
                <div>
                    <label class="block mb-1 opacity-70">Session Name</label>
                    <input type="text" id="cfg-title" value="Cap or Trap" class="w-full p-2 bg-white/5 border border-white/10 rounded">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block mb-1 opacity-70">Points / Core Match</label>
                        <input type="number" id="cfg-points" value="10" class="w-full p-2 bg-white/5 border border-white/10 rounded">
                    </div>
                    <div>
                        <label class="block mb-1 opacity-70">Sec / Deck Question</label>
                        <input type="number" id="cfg-timer" value="15" class="w-full p-2 bg-white/5 border border-white/10 rounded">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2 bg-black/20 p-2 rounded-xl">
                    <div>
                        <label class="block mb-1 text-emerald-400">Right Label (True)</label>
                        <input type="text" id="lbl-right" value="CAP" class="w-full p-2 bg-white/5 border border-white/10 rounded">
                    </div>
                    <div>
                        <label class="block mb-1 text-red-400">Left Label (False)</label>
                        <input type="text" id="lbl-left" value="TRAP" class="w-full p-2 bg-white/5 border border-white/10 rounded">
                    </div>
                    <div>
                        <label class="block mb-1 text-amber-400">Up Label (Skip)</label>
                        <input type="text" id="lbl-up" value="SKIP" class="w-full p-2 bg-white/5 border border-white/10 rounded">
                    </div>
                    <div>
                        <label class="block mb-1 text-slate-400">Down Label (Trash)</label>
                        <input type="text" id="lbl-down" value="TRASH" class="w-full p-2 bg-white/5 border border-white/10 rounded">
                    </div>
                </div>

                <div class="bg-black/20 p-2 rounded-xl space-y-2">
                    <p class="font-bold text-blue-400">App Cosmetics & Audio</p>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block mb-1 opacity-70">UI Theme</label>
                            <select id="cfg-theme" class="w-full p-2 bg-slate-800 border border-white/10 rounded">
                                <option value="dark-glass">Dark Glass</option>
                                <option value="light-glass">Light Glass</option>
                            </select>
                        </div>
                        <div>
                            <label class="block mb-1 opacity-70">Vibe Track</label>
                            <select id="cfg-music" class="w-full p-2 bg-slate-800 border border-white/10 rounded">
                                <option value="none">No Audio Track</option>
                                <option value="relax">Lofi Chill</option>
                                <option value="fun">Upbeat Fun</option>
                                <option value="heat">Pulse Pounding</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block mb-1 opacity-70">Glass Blur Slider</label>
                        <input type="range" id="cfg-blur" min="0" max="30" value="12" class="w-full">
                    </div>
                    <div>
                        <label class="block mb-1 opacity-70">Accent Base Theme Color</label>
                        <input type="color" id="cfg-accent" value="#3b82f6" class="w-full h-8 bg-transparent cursor-pointer">
                    </div>
                    <div>
                        <label class="block mb-1 opacity-70">Font Profile</label>
                        <select id="cfg-font" class="w-full p-2 bg-slate-800 border border-white/10 rounded">
                            <option value="'Space Grotesk', sans-serif">Modern / Tech</option>
                            <option value="'Plus Jakarta Sans', sans-serif">Clean / Formal</option>
                            <option value="'Bungee', cursive">Aggressive Comic</option>
                        </select>
                    </div>
                </div>

                <div class="bg-black/20 p-2 rounded-xl space-y-2">
                    <p class="font-bold text-amber-400">Flashcards & Question Engineering</p>
                    <textarea id="cfg-raw-questions" rows="4" placeholder="Format: Question text | true (or false)&#10;Example: Sound waves require a physical medium to travel. | true" class="w-full p-2 bg-white/5 border border-white/10 rounded placeholder:opacity-40 text-xs"></textarea>
                    <div>
                        <label class="block mb-1 opacity-70">Bonus Open-Ended Question Prompt</label>
                        <input type="text" id="cfg-open-ended" placeholder="e.g., Elaborate on your strategy choice during the review session." class="w-full p-2 bg-white/5 border border-white/10 rounded">
                    </div>
                </div>
            </div>

            <div class="space-y-2 pt-2 border-t border-white/10">
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="downloadSessionLog()" class="bg-blue-600 hover:bg-blue-700 py-2 rounded font-bold text-xs"><i class="fa-solid fa-file-export mr-1"></i>Export Session</button>
                    <button onclick="triggerLogImport()" class="bg-indigo-600 hover:bg-indigo-700 py-2 rounded font-bold text-xs"><i class="fa-solid fa-file-import mr-1"></i>Import Session</button>
                </div>
                <input type="file" id="import-log-file" class="hidden" accept=".txt,.json" onchange="importSessionLog(event)">
                <button onclick="saveSessionConfiguration()" class="w-full bg-emerald-500 hover:bg-emerald-600 py-3 rounded-xl font-bold text-xs tracking-wider uppercase"><i class="fa-solid fa-floppy-disk mr-2"></i>Save & Fire Up Session</button>
                <button onclick="nukeSession()" class="w-full bg-red-600/30 hover:bg-red-600 text-red-200 py-2 rounded-xl font-bold text-xs"><i class="fa-solid fa-radiation mr-2"></i>N
